name: Project contracts
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate catalog and source contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Inventory Lazarus projects and packages
        if: always()
        run: python tools/inventory_lazarus.py --json > lazarus-inventory.json
      - name: Upload Lazarus inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lazarus-inventory
          path: lazarus-inventory.json
          if-no-files-found: warn
