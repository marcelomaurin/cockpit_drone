name: Project contracts
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate catalog and source contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Inventory Lazarus projects and packages
        run: python tools/inventory_lazarus.py --json
