name: Lazarus build diagnostic

on:
  push:
    branches: [master]
    paths:
      - '**/*.pas'
      - '**/*.lpr'
      - 'tools/sitl_heartbeat_monitor.py'
      - 'tests/test_sitl_*.py'
      - 'tests/test_lazarus_inventory.py'
      - 'tools/inventory_lazarus.py'
      - '**/*.lpi'
      - '**/*.lpk'
      - '.github/workflows/lazarus-build.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.pas'
      - 'tools/sitl_heartbeat_monitor.py'
      - 'tests/test_sitl_*.py'
      - '**/*.lpi'
      - '**/*.lpk'
      - '.github/workflows/lazarus-build.yml'

jobs:
  linux-build-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lazarus and Free Pascal
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y lazarus fpc
      - name: Record compiler and project inventory
        run: |
          mkdir -p build-diagnostics
          fpc -iV | tee build-diagnostics/fpc-version.txt
          lazbuild --version | tee build-diagnostics/lazbuild-version.txt
          python3 tools/inventory_lazarus.py --json > build-diagnostics/lazarus-inventory.json
          python3 tools/inventory_lazarus.py | tee build-diagnostics/lazarus-packages.txt
          python3 -m unittest discover -s tests -p 'test_lazarus_inventory.py' -v
      - name: Test Python SITL heartbeat and UI contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-diagnostics
          python3 -m unittest discover -s tests -p 'test_sitl_*.py' -v 2>&1 | tee build-diagnostics/sitl-python-tests.log
      - name: Test read-only SITL telemetry state in Pascal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-diagnostics/pascal-units
          fpc -Fu./src -FUbuild-diagnostics/pascal-units -FEbuild-diagnostics tests/test_sitl_telemetry_state.pas 2>&1 | tee build-diagnostics/sitl-state-build.log
          build-diagnostics/test_sitl_telemetry_state 2>&1 | tee build-diagnostics/sitl-state-test.log
          fpc -Fu./src -FUbuild-diagnostics/pascal-units -FEbuild-diagnostics tests/test_sitl_telemetry_bridge.pas 2>&1 | tee build-diagnostics/sitl-bridge-build.log
          build-diagnostics/test_sitl_telemetry_bridge 2>&1 | tee build-diagnostics/sitl-bridge-test.log
      - name: Test simulator physics and protocol bridge independently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-diagnostics/pascal-units
          fpc -Fu./src -FUbuild-diagnostics/pascal-units -FEbuild-diagnostics tests/test_simulator_bridge.pas 2>&1 | tee build-diagnostics/simulator-bridge-build.log
          build-diagnostics/test_simulator_bridge 2>&1 | tee build-diagnostics/simulator-bridge-test.log
      - name: Build standalone and diagnostic Lazarus projects
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-diagnostics

          # 1. Compilacao obrigatoria do simulador oficial (LCL nativa)
          echo "=== Building simulador/src/simulador.lpi (Official LCL) ===" | tee -a build-diagnostics/build.log
          if [ -f "simulador/src/simulador.lpi" ]; then
            lazbuild "simulador/src/simulador.lpi" 2>&1 | tee -a build-diagnostics/build.log
          else
            echo "ERRO: simulador/src/simulador.lpi nao encontrado!" | tee -a build-diagnostics/build.log
            exit 1
          fi

          # 2. Compilacao diagnostica de drone.lpi (requer pacotes de terceiros: OpenAI/ChatGPT, BGRABitmap, etc.)
          # Projetos legados como CX10W.lpi sao ignorados por serem obsoletos.
          if [ -f "src/drone.lpi" ]; then
            echo "=== Building src/drone.lpi (Diagnostic / External Packages) ===" | tee -a build-diagnostics/build.log
            lazbuild "src/drone.lpi" 2>&1 | tee -a build-diagnostics/build.log || echo "NOTE: src/drone.lpi requires third-party packages (openai_*, BGRABitmap, etc.) not installed on headless CI runner." | tee -a build-diagnostics/build.log
          fi
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lazarus-linux-build-diagnostics
          path: build-diagnostics/
          if-no-files-found: warn
