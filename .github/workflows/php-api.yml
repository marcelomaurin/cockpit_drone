name: PHP multiplayer API checks
on:
  push:
    branches: [master]
    paths:
      - 'PHP/**'
      - '.github/workflows/php-api.yml'
  pull_request:
    paths:
      - 'PHP/**'
      - '.github/workflows/php-api.yml'
  workflow_dispatch:

jobs:
  php-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated configuration
        run: cp PHP/config_sample.php PHP/config.php
      - name: Check PHP version and extensions
        run: |
          php -v
          php -m | grep -i '^curl$'
      - name: Lint all PHP files
        run: |
          find PHP -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test session listing ignores rate-limit records
        run: php PHP/tests/storage_sessions.php
      - name: Test direct entrypoint and missing configuration
        run: python3 tests/run_php_entrypoint.py "$(command -v php)"
      - name: Install WebSocket dependencies
        working-directory: PHP
        run: composer install --no-interaction --no-dev --prefer-dist
      - name: WebSocket and REST integration
        run: |
          python3 -m pip install 'websockets==14.1'
          python3 tests/run_multiplayer_ws.py "$(command -v php)"
      - name: Start isolated test server
        run: |
          mkdir -p "$RUNNER_TEMP/drone-data"
          DRONE_STORAGE=files DRONE_DATA_DIR="$RUNNER_TEMP/drone-data" php -S 127.0.0.1:8765 -t PHP PHP/index.php >"$RUNNER_TEMP/drone-php.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/drone-php.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/drone-php.log"
          exit 1
      - name: Run API smoke tests
        run: php PHP/tests/smoke.php http://127.0.0.1:8765
      - name: MySQL integration test
        env:
          DRONE_STORAGE: mysql
          DRONE_MYSQL_DSN: mysql:host=127.0.0.1;dbname=drone;charset=utf8mb4
          DRONE_MYSQL_USER: root
          DRONE_MYSQL_PASSWORD: root
        run: |
          sudo systemctl start mysql
          sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root';" || true
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS drone"
          mysql -h 127.0.0.1 -u root -proot drone < PHP/schema.sql
          DRONE_STORAGE=mysql DRONE_MYSQL_DSN="$DRONE_MYSQL_DSN" DRONE_MYSQL_USER=root DRONE_MYSQL_PASSWORD=root php -S 127.0.0.1:8766 -t PHP PHP/index.php >"$RUNNER_TEMP/drone-mysql.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8766/health >/dev/null; then break; fi
            sleep 1
          done
          php PHP/tests/smoke.php http://127.0.0.1:8766
      - name: Show server logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/drone-php.log" || true
