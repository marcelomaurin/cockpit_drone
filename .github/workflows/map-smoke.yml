name: Map image smoke tests
on:
  push:
    branches: [master]
    paths:
      - 'src/map.pas'
      - 'PHP/google_maps_simulator.html'
      - 'tests/test_map_sources.py'
      - '.github/workflows/map-smoke.yml'
  workflow_dispatch:
jobs:
  map-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check OpenStreetMap fallback and Google Maps viewer
        run: python -m unittest discover -s tests -p 'test_map_sources.py' -v
